<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start a project | Amphoteb LLC</title>
<meta name="description" content="Tell Amphoteb about your website or software project.">
<meta name="theme-color" content="#0e1b2c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
<main>
  <a href="/" style="border:0"><img class="logo-small" src="/logo.svg" alt="Amphoteb" width="1393" height="287"></a>

  <p class="intro">Need a website, desktop software or a mobile app? Tell us a bit about
  it and we'll get back to you soon.</p>

  <form id="contact" novalidate>
    <div class="row">
      <div>
        <label for="name">Name <span class="req">*</span></label>
        <input id="name" name="name" autocomplete="name" maxlength="100" required>
      </div>
      <div>
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="200" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
      </div>
      <div>
        <label for="company">Company</label>
        <input id="company" name="company" autocomplete="organization" maxlength="120">
      </div>
    </div>
    <div>
      <label for="topic">What do you need?</label>
      <select id="topic" name="topic">
        <option>Website</option>
        <option>Desktop software</option>
        <option>Mobile app</option>
        <option>Something else</option>
      </select>
    </div>
    <div>
      <label for="message">Message <span class="req">*</span></label>
      <textarea id="message" name="message" maxlength="5000" required
        placeholder="What are you looking to build? Any timeline or budget in mind?"></textarea>
    </div>
    <!-- Hidden from people; bots fill it in and get ignored. -->
    <div class="hp" aria-hidden="true">
      <label for="botcheck">Leave this empty</label>
      <input id="botcheck" name="botcheck" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit">Send message</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<footer>
  <a class="social" href="https://www.facebook.com/profile.php?id=61596194876783" target="_blank" rel="noopener" aria-label="Amphoteb on Facebook">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg>
  </a>
  <p>&copy; 2026 Amphoteb LLC. All rights reserved.</p>
</footer>
<script>
  // Sends the form through Web3Forms (web3forms.com), which emails it to
  // ctaus@heymon.gg. The access key is meant to be public: it can only send
  // to the address it was created for.
  const ACCESS_KEY = "af0f2c36-94b8-4adf-9448-f97e17c57ee3";
  const ENDPOINT = "https://api.web3forms.com/submit";
  const form = document.getElementById("contact");
  const status = document.getElementById("status");
  const button = form.querySelector("button");

  function show(text, kind) {
    status.textContent = text;
    status.className = "status " + kind;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (!data.name.trim()) return show("Please enter your name.", "error");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) {
      return show("Please enter a valid email address.", "error");
    }
    if (data.message.trim().length < 10) {
      return show("Please tell us a little more in your message.", "error");
    }
    if (data.botcheck) return; // a bot filled in the hidden field
    Object.assign(data, {
      access_key: ACCESS_KEY,
      subject: `New inquiry: ${data.topic} from ${data.name.trim()}`,
      from_name: "Amphoteb website",
    });
    button.disabled = true;
    show("Sending…", "");
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.success) throw new Error("");
      form.reset();
      show("Thanks! Your message is on its way. We'll be in touch soon.", "ok");
    } catch (err) {
      show(err.message || "Sorry, your message couldn't be sent. Please email ctaus@heymon.gg.", "error");
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
